name: Portfolio CI & Security Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run weekly dependency and security checks every Monday at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  verify:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: ESLint Verification
        run: npm run lint

      - name: Production Build Test
        run: npm run build

      - name: Verify Critical Build Artifacts
        run: |
          test -f dist/index.html || exit 1
          test -f dist/robots.txt || exit 1
          test -f dist/sitemap.xml || exit 1
          echo "All critical production artifacts verified successfully."

